<svg xmlns="http://www.w3.org/2000/svg" width="480" height="618" viewBox="0 0 480 618" role="img" aria-labelledby="title">
<title id="title">CustomLift optional dependencies and execution order</title>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#858b9e" stroke-width="1.5"/></marker></defs>
<g font-family="Arial, Noto Sans JP, sans-serif">
<rect x="20" y="12" width="4" height="20" rx="2" fill="#5954b5"/>
<text x="36" y="27" text-anchor="start" fill="#5954b5" font-size="15" font-weight="700">UPDATE / STANDARD WRITERS PRESENT</text>
<rect x="20" y="50" width="440" height="92" rx="10" fill="none" stroke="#c7c9dc"/>
<text x="240" y="77" text-anchor="middle" fill="#242638" font-size="19" font-weight="600">Standard velocity writers</text>
<text x="240" y="99" text-anchor="middle" fill="#555b70" font-size="16" font-weight="400">gravity / force / noise / vortex</text>
<text x="240" y="121" text-anchor="middle" fill="#555b70" font-size="16" font-weight="400">drag / limit-velocity</text>
<path d="M240 146 V192" fill="none" stroke="#858b9e" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="260" y="174" text-anchor="start" fill="#555b70" font-size="15" font-weight="400">optionalDependencies</text>
<rect x="20" y="200" width="440" height="70" rx="10" fill="#f0f0fa" stroke="#5954b5"/>
<text x="240" y="227" text-anchor="middle" fill="#242638" font-size="19" font-weight="600">custom-lift</text>
<text x="240" y="249" text-anchor="middle" fill="#555b70" font-size="16" font-weight="400">Add velocity after the standard writers</text>
<path d="M240 274 V308" fill="none" stroke="#858b9e" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="20" y="316" width="440" height="70" rx="10" fill="none" stroke="#c7c9dc"/>
<text x="240" y="343" text-anchor="middle" fill="#242638" font-size="19" font-weight="600">motion</text>
<text x="240" y="365" text-anchor="middle" fill="#555b70" font-size="16" font-weight="400">Use the added velocity for motion</text>
<text x="240" y="416" text-anchor="middle" fill="#555b70" font-size="15" font-weight="400">Drag / Limit do not affect this addition in the same step</text>
<rect x="20" y="452" width="4" height="20" rx="2" fill="#5954b5"/>
<text x="36" y="467" text-anchor="start" fill="#5954b5" font-size="15" font-weight="700">UPDATE / NO STANDARD WRITERS</text>
<rect x="20" y="490" width="200" height="70" rx="10" fill="#f0f0fa" stroke="#5954b5"/>
<text x="120" y="517" text-anchor="middle" fill="#242638" font-size="19" font-weight="600">custom-lift</text>
<text x="120" y="539" text-anchor="middle" fill="#555b70" font-size="16" font-weight="400">Custom velocity</text>
<path d="M224 525 H254" fill="none" stroke="#858b9e" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="260" y="490" width="200" height="70" rx="10" fill="none" stroke="#c7c9dc"/>
<text x="360" y="517" text-anchor="middle" fill="#242638" font-size="19" font-weight="600">motion</text>
<text x="360" y="539" text-anchor="middle" fill="#555b70" font-size="16" font-weight="400">Update position</text>
<text x="240" y="593" text-anchor="middle" fill="#555b70" font-size="15" font-weight="400">CustomLift remains when optional targets are absent</text>
</g></svg>
