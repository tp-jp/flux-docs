<svg xmlns="http://www.w3.org/2000/svg" width="480" height="564" viewBox="0 0 480 564" role="img" aria-labelledby="title">
<title id="title">要素インデックスとテクスチャ座標</title>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#85879a" stroke-width="1.5"/></marker></defs>
<g font-family="Arial, Noto Sans JP, sans-serif">
<rect x="20" y="12" width="4" height="20" rx="2" fill="#aaa6ff"/>
<text x="36" y="27" text-anchor="start" fill="#aaa6ff" font-size="15" font-weight="700">Width = 3 / Count = 5 / Capacity = 9</text>
<text x="133" y="67" text-anchor="middle" fill="#b9bac8" font-size="16" font-weight="400">x = 0</text>
<text x="241" y="67" text-anchor="middle" fill="#b9bac8" font-size="16" font-weight="400">x = 1</text>
<text x="349" y="67" text-anchor="middle" fill="#b9bac8" font-size="16" font-weight="400">x = 2</text>
<text x="43" y="121" text-anchor="middle" fill="#b9bac8" font-size="16" font-weight="400">y = 0</text>
<rect x="85" y="82" width="96" height="70" rx="10" fill="#292a35" stroke="#aaa6ff"/>
<text x="133" y="109" text-anchor="middle" fill="#eeeef3" font-size="19" font-weight="600">0</text>
<text x="133" y="131" text-anchor="middle" fill="#b9bac8" font-size="16" font-weight="400">有効</text>
<rect x="193" y="82" width="96" height="70" rx="10" fill="#292a35" stroke="#aaa6ff"/>
<text x="241" y="109" text-anchor="middle" fill="#eeeef3" font-size="19" font-weight="600">1</text>
<text x="241" y="131" text-anchor="middle" fill="#b9bac8" font-size="16" font-weight="400">有効</text>
<rect x="301" y="82" width="96" height="70" rx="10" fill="#292a35" stroke="#aaa6ff"/>
<text x="349" y="109" text-anchor="middle" fill="#eeeef3" font-size="19" font-weight="600">2</text>
<text x="349" y="131" text-anchor="middle" fill="#b9bac8" font-size="16" font-weight="400">有効</text>
<text x="43" y="207" text-anchor="middle" fill="#b9bac8" font-size="16" font-weight="400">y = 1</text>
<rect x="85" y="168" width="96" height="70" rx="10" fill="#292a35" stroke="#aaa6ff"/>
<text x="133" y="195" text-anchor="middle" fill="#eeeef3" font-size="19" font-weight="600">3</text>
<text x="133" y="217" text-anchor="middle" fill="#b9bac8" font-size="16" font-weight="400">有効</text>
<rect x="193" y="168" width="96" height="70" rx="10" fill="#292a35" stroke="#aaa6ff"/>
<text x="241" y="195" text-anchor="middle" fill="#eeeef3" font-size="19" font-weight="600">4</text>
<text x="241" y="217" text-anchor="middle" fill="#b9bac8" font-size="16" font-weight="400">有効</text>
<rect x="301" y="168" width="96" height="70" rx="10" fill="none" stroke="#525366"/>
<text x="349" y="195" text-anchor="middle" fill="#eeeef3" font-size="19" font-weight="600">5</text>
<text x="349" y="217" text-anchor="middle" fill="#b9bac8" font-size="16" font-weight="400">範囲外</text>
<text x="43" y="293" text-anchor="middle" fill="#b9bac8" font-size="16" font-weight="400">y = 2</text>
<rect x="85" y="254" width="96" height="70" rx="10" fill="none" stroke="#525366"/>
<text x="133" y="281" text-anchor="middle" fill="#eeeef3" font-size="19" font-weight="600">6</text>
<text x="133" y="303" text-anchor="middle" fill="#b9bac8" font-size="16" font-weight="400">範囲外</text>
<rect x="193" y="254" width="96" height="70" rx="10" fill="none" stroke="#525366"/>
<text x="241" y="281" text-anchor="middle" fill="#eeeef3" font-size="19" font-weight="600">7</text>
<text x="241" y="303" text-anchor="middle" fill="#b9bac8" font-size="16" font-weight="400">範囲外</text>
<rect x="301" y="254" width="96" height="70" rx="10" fill="none" stroke="#525366"/>
<text x="349" y="281" text-anchor="middle" fill="#eeeef3" font-size="19" font-weight="600">8</text>
<text x="349" y="303" text-anchor="middle" fill="#b9bac8" font-size="16" font-weight="400">範囲外</text>
<text x="240" y="354" text-anchor="middle" fill="#b9bac8" font-size="18" font-weight="400">index = y × width + x</text>
<text x="240" y="381" text-anchor="middle" fill="#b9bac8" font-size="16" font-weight="400">例：インデックス4 → (x, y) = (1, 1)</text>
<path d="M240 394 V418" fill="none" stroke="#85879a" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="45" y="426" width="390" height="70" rx="10" fill="#292a35" stroke="#aaa6ff"/>
<text x="240" y="453" text-anchor="middle" fill="#eeeef3" font-size="19" font-weight="600">1ピクセル = 1要素 = 4成分</text>
<text x="240" y="475" text-anchor="middle" fill="#b9bac8" font-size="16" font-weight="400">float4(x, y, z, w) ↔ Color(r, g, b, a)</text>
<text x="240" y="523" text-anchor="middle" fill="#b9bac8" font-size="16" font-weight="400">数字は保存値ではなくインデックス</text>
<text x="240" y="547" text-anchor="middle" fill="#b9bac8" font-size="16" font-weight="400">範囲外のピクセルも確保済み容量に含まれる</text>
</g></svg>
