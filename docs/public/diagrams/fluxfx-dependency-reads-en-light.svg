<svg xmlns="http://www.w3.org/2000/svg" width="480" height="580" viewBox="0 0 480 580" role="img" aria-labelledby="title">
<title id="title">Ordering and reading Values</title>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#858b9e" stroke-width="1.5"/></marker></defs>
<g font-family="Arial, Noto Sans JP, sans-serif">
<rect x="20" y="12" width="4" height="20" rx="2" fill="#5954b5"/>
<text x="36" y="27" text-anchor="start" fill="#5954b5" font-size="15" font-weight="700">dependencies / ORDER ONLY</text>
<rect x="20" y="50" width="440" height="70" rx="10" fill="none" stroke="#c7c9dc"/>
<text x="240" y="77" text-anchor="middle" fill="#242638" font-size="19" font-weight="600">motion</text>
<text x="240" y="99" text-anchor="middle" fill="#555b70" font-size="16" font-weight="400">Predecessor Operation</text>
<path d="M240 124 V168" fill="none" stroke="#858b9e" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="260" y="150" text-anchor="start" fill="#555b70" font-size="15" font-weight="400">Before → after</text>
<rect x="20" y="176" width="440" height="70" rx="10" fill="#f0f0fa" stroke="#5954b5"/>
<text x="240" y="203" text-anchor="middle" fill="#242638" font-size="19" font-weight="600">custom-position</text>
<text x="240" y="225" text-anchor="middle" fill="#555b70" font-size="16" font-weight="400">Lists motion in dependencies</text>
<text x="240" y="276" text-anchor="middle" fill="#555b70" font-size="16" font-weight="400">Declare Value reads separately</text>
<rect x="20" y="312" width="4" height="20" rx="2" fill="#197e70"/>
<text x="36" y="327" text-anchor="start" fill="#197e70" font-size="15" font-weight="700">AfterOperation / READ A RESULT</text>
<rect x="20" y="350" width="440" height="70" rx="10" fill="none" stroke="#c7c9dc"/>
<text x="240" y="377" text-anchor="middle" fill="#242638" font-size="19" font-weight="600">motion</text>
<text x="240" y="399" text-anchor="middle" fill="#555b70" font-size="16" font-weight="400">Writes particle.position</text>
<path d="M240 424 V488" fill="none" stroke="#858b9e" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="260" y="450" text-anchor="start" fill="#555b70" font-size="15" font-weight="400">particle.position</text>
<text x="260" y="472" text-anchor="start" fill="#555b70" font-size="15" font-weight="400">Result from motion</text>
<rect x="20" y="496" width="440" height="70" rx="10" fill="#f0f0fa" stroke="#5954b5"/>
<text x="240" y="523" text-anchor="middle" fill="#242638" font-size="19" font-weight="600">custom-position</text>
<text x="240" y="545" text-anchor="middle" fill="#555b70" font-size="16" font-weight="400">Reads position with AfterOperation</text>
</g></svg>
