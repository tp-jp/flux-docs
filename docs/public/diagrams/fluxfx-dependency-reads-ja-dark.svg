<svg xmlns="http://www.w3.org/2000/svg" width="480" height="580" viewBox="0 0 480 580" role="img" aria-labelledby="title">
<title id="title">実行順の指定とValueの読み取り</title>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#85879a" stroke-width="1.5"/></marker></defs>
<g font-family="Arial, Noto Sans JP, sans-serif">
<rect x="20" y="12" width="4" height="20" rx="2" fill="#aaa6ff"/>
<text x="36" y="27" text-anchor="start" fill="#aaa6ff" font-size="15" font-weight="700">dependencies / 順序を指定</text>
<rect x="20" y="50" width="440" height="70" rx="10" fill="none" stroke="#525366"/>
<text x="240" y="77" text-anchor="middle" fill="#eeeef3" font-size="19" font-weight="600">motion</text>
<text x="240" y="99" text-anchor="middle" fill="#b9bac8" font-size="16" font-weight="400">先に実行するOperation</text>
<path d="M240 124 V168" fill="none" stroke="#85879a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="260" y="150" text-anchor="start" fill="#b9bac8" font-size="15" font-weight="400">先行 → 後続</text>
<rect x="20" y="176" width="440" height="70" rx="10" fill="#292a35" stroke="#aaa6ff"/>
<text x="240" y="203" text-anchor="middle" fill="#eeeef3" font-size="19" font-weight="600">custom-position</text>
<text x="240" y="225" text-anchor="middle" fill="#b9bac8" font-size="16" font-weight="400">dependencies に motion を指定</text>
<text x="240" y="276" text-anchor="middle" fill="#b9bac8" font-size="16" font-weight="400">読むValueは別途宣言する</text>
<rect x="20" y="312" width="4" height="20" rx="2" fill="#65cbb9"/>
<text x="36" y="327" text-anchor="start" fill="#65cbb9" font-size="15" font-weight="700">AfterOperation / 結果を読む</text>
<rect x="20" y="350" width="440" height="70" rx="10" fill="none" stroke="#525366"/>
<text x="240" y="377" text-anchor="middle" fill="#eeeef3" font-size="19" font-weight="600">motion</text>
<text x="240" y="399" text-anchor="middle" fill="#b9bac8" font-size="16" font-weight="400">particle.position を書く</text>
<path d="M240 424 V488" fill="none" stroke="#85879a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="260" y="450" text-anchor="start" fill="#b9bac8" font-size="15" font-weight="400">particle.position</text>
<text x="260" y="472" text-anchor="start" fill="#b9bac8" font-size="15" font-weight="400">motion が書いた結果</text>
<rect x="20" y="496" width="440" height="70" rx="10" fill="#292a35" stroke="#aaa6ff"/>
<text x="240" y="523" text-anchor="middle" fill="#eeeef3" font-size="19" font-weight="600">custom-position</text>
<text x="240" y="545" text-anchor="middle" fill="#b9bac8" font-size="16" font-weight="400">AfterOperation で位置を読む</text>
</g></svg>
