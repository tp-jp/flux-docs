<svg xmlns="http://www.w3.org/2000/svg" width="480" height="654" viewBox="0 0 480 654" role="img" aria-labelledby="title">
<title id="title">読み戻しの受付と完了</title>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#858b9e" stroke-width="1.5"/></marker></defs>
<g font-family="Arial, Noto Sans JP, sans-serif">
<rect x="20" y="12" width="4" height="20" rx="2" fill="#5954b5"/>
<text x="36" y="27" text-anchor="start" fill="#5954b5" font-size="15" font-weight="700">REQUEST / 要求を開始</text>
<rect x="20" y="50" width="440" height="70" rx="10" fill="#f0f0fa" stroke="#5954b5"/>
<text x="240" y="77" text-anchor="middle" fill="#242638" font-size="19" font-weight="600">TryRequest(buffer, receiver)</text>
<text x="240" y="99" text-anchor="middle" fill="#555b70" font-size="16" font-weight="400">戻り値は受付結果</text>
<path d="M180 124 V153 H126 V184" fill="none" stroke="#858b9e" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M300 124 V153 H354 V184" fill="none" stroke="#858b9e" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="166" y="175" text-anchor="middle" fill="#555b70" font-size="16" font-weight="400">false</text>
<text x="394" y="175" text-anchor="middle" fill="#555b70" font-size="16" font-weight="400">true</text>
<rect x="20" y="192" width="212" height="92" rx="10" fill="none" stroke="#c7c9dc"/>
<text x="126" y="219" text-anchor="middle" fill="#242638" font-size="19" font-weight="600">受付拒否</text>
<text x="126" y="241" text-anchor="middle" fill="#555b70" font-size="16" font-weight="400">キューに入らない</text>
<text x="126" y="263" text-anchor="middle" fill="#555b70" font-size="16" font-weight="400">この要求の通知なし</text>
<rect x="248" y="192" width="212" height="92" rx="10" fill="none" stroke="#c7c9dc"/>
<text x="354" y="219" text-anchor="middle" fill="#242638" font-size="19" font-weight="600">完了を待つ</text>
<text x="354" y="241" text-anchor="middle" fill="#555b70" font-size="16" font-weight="400">IsRequesting = true</text>
<text x="354" y="263" text-anchor="middle" fill="#555b70" font-size="16" font-weight="400">まだ結果を読まない</text>
<path d="M354 288 V317 H240 V342" fill="none" stroke="#858b9e" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="20" y="350" width="440" height="92" rx="10" fill="#f0f0fa" stroke="#5954b5"/>
<text x="240" y="377" text-anchor="middle" fill="#242638" font-size="19" font-weight="600">_OnFluxReadbackComplete</text>
<text x="240" y="399" text-anchor="middle" fill="#555b70" font-size="16" font-weight="400">IsRequesting = false</text>
<text x="240" y="421" text-anchor="middle" fill="#555b70" font-size="16" font-weight="400">ここで Succeeded を確認</text>
<path d="M180 446 V477 H126 V508" fill="none" stroke="#858b9e" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M300 446 V477 H354 V508" fill="none" stroke="#858b9e" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="166" y="499" text-anchor="middle" fill="#555b70" font-size="16" font-weight="400">false</text>
<text x="394" y="499" text-anchor="middle" fill="#555b70" font-size="16" font-weight="400">true</text>
<rect x="20" y="516" width="212" height="92" rx="10" fill="none" stroke="#c7c9dc"/>
<text x="126" y="543" text-anchor="middle" fill="#242638" font-size="19" font-weight="600">読み戻し失敗</text>
<text x="126" y="565" text-anchor="middle" fill="#555b70" font-size="16" font-weight="400">Dataを使わない</text>
<text x="126" y="587" text-anchor="middle" fill="#555b70" font-size="16" font-weight="400">受付拒否とは別</text>
<rect x="248" y="516" width="212" height="92" rx="10" fill="none" stroke="#c7c9dc"/>
<text x="354" y="543" text-anchor="middle" fill="#242638" font-size="19" font-weight="600">結果を使う</text>
<text x="354" y="565" text-anchor="middle" fill="#555b70" font-size="16" font-weight="400">Data[0 .. Count - 1]</text>
<text x="354" y="587" text-anchor="middle" fill="#555b70" font-size="16" font-weight="400">有効要素だけ読む</text>
<text x="240" y="638" text-anchor="middle" fill="#555b70" font-size="16" font-weight="400">受付成功と転送成功は別に確認する</text>
</g></svg>
